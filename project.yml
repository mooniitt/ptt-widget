name: PTTWidget
options:
  bundleIdPrefix: com.mooniitt
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  SWIFT_VERSION: "5.9"
  CODE_SIGNING_ALLOWED: NO
  CODE_SIGN_IDENTITY: ""
  DEVELOPMENT_TEAM: ""

targets:
  PTTApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PTTApp
      - path: Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.mooniitt.pttwidget
      INFOPLIST_FILE: PTTApp/Info.plist
      GENERATE_INFOPLIST_FILE: NO
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: PTTWidgetExtension

  PTTWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PTTWidget
      - path: Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.mooniitt.pttwidget.extension
      INFOPLIST_FILE: PTTWidget/Info.plist
      GENERATE_INFOPLIST_FILE: NO
